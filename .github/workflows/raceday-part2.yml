
name: RaceDay Part 3 - API and MVC Build and Test

on:
  push:
    branches:
      - main
      - part2-api-development
      - part3-final-submission

  pull_request:
    branches:
      - main
      - part2-api-development
      - part3-final-submission

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify solution structure
        run: |
          test -f RaceDay/RaceDay.slnx
          test -f RaceDay/RaceDay.API/RaceDay.API.csproj
          test -f RaceDay/RaceDay.Web/RaceDay.Web.csproj

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build complete solution (API and MVC)
        run: dotnet build RaceDay/RaceDay.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay/RaceDay.slnx --configuration Release --no-build
