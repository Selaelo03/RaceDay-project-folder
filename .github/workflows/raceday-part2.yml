
name: RaceDay Part 2 - Build and Test

on:
  push:
    branches:
      - main
      - part2-api-development
  pull_request:
    branches:
      - main
      - part2-api-development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify RaceDay structure
        run: |
          ls -la RaceDay
          ls -la RaceDay/RaceDay.API
          ls -la RaceDay/RaceDay.API.Tests

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build RaceDay solution
        run: dotnet build RaceDay/RaceDay.slnx --configuration Release --no-restore

      - name: Run RaceDay unit tests
        run: dotnet test RaceDay/RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --no-restore
